version: "2"

linters:
  default: all
  disable:
    - asasalint
    - containedctx
    - cyclop
    - depguard
    - dupl
    - dupword
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errorlint
    - exhaustive
    - exhaustruct
    - forbidigo
    - forcetypeassert
    - funcorder
    - funlen
    - gochecknoinits
    - gochecknoglobals
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godox
    - godot
    - gosmopolitan
    - gosec
    - govet
    - interfacebloat
    - ineffassign
    - ireturn
    - lll
    - maintidx
    - mirror
    - mnd
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - noinlineerr
    - nlreturn
    - nolintlint
    - nonamedreturns
    - paralleltest
    - perfsprint
    - predeclared
    - recvcheck
    - revive
    - staticcheck
    - testpackage
    - testifylint
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
      dot-import-whitelist:
        - fmt
      initialisms:
        - ACL
        - API
        - ASCII
        - CPU
        - CSS
        - DNS
        - EOF
        - GUID
        - HTML
        - HTTP
        - HTTPS
        - ID
        - IP
        - JSON
        - QPS
        - RAM
        - RPC
        - SLA
        - SMTP
        - SQL
        - SSH
        - TCP
        - TLS
        - TTL
        - UDP
        - UI
        - GID
        - UID
        - UUID
        - URI
        - URL
        - UTF8
        - VM
        - XML
        - XMPP
        - XSRF
        - XSS
      http-status-code-whitelist:
        - "200"
        - "400"
        - "404"
        - "500"
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    # Keep SDK development test suites and examples out of default lint results.
    paths:
      - ^test($|/)
      - ^performance($|/)
      - ^example($|/)
